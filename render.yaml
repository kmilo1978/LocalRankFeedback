services:
  - type: web
    name: localrank-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd packages/backend && npm install && npx prisma generate && npm run build
    startCommand: cd packages/backend && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BACKEND_PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
