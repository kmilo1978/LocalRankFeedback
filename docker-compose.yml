version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: localrank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localrank
      POSTGRES_PASSWORD: localrank123
      POSTGRES_DB: localrank_feedback
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localrank -d localrank_feedback"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache + queues)
  redis:
    image: redis:7-alpine
    container_name: localrank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
